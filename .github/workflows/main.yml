name: Build GrsProbe (ARM Windows CE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kaynak kodu indir
      uses: actions/checkout@v4

    - name: ARM WinCE toolchain kur
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gcc binutils wget tar
        echo "Toolchain indiriliyor..."
        wget -q --tries=3 \
          "https://downloads.sourceforge.net/project/cegcc/mingw32ce/mingw32ce-0.59.1/mingw32ce-0.59.1-linux-i386.tar.bz2" \
          -O /tmp/mingw32ce.tar.bz2
        sudo mkdir -p /opt/mingw32ce
        sudo tar xjf /tmp/mingw32ce.tar.bz2 -C /opt/mingw32ce --strip-components=1
        echo "/opt/mingw32ce/bin" >> $GITHUB_PATH

    - name: Toolchain kontrol
      run: arm-mingw32ce-g++ --version || echo "Toolchain hatasi"

    - name: Derle
      run: |
        arm-mingw32ce-g++ \
          -DUNICODE -D_UNICODE \
          -D_WIN32_WCE=0x0500 -DUNDER_CE=0x0500 \
          -DWIN32 -DARM -O1 \
          -fno-exceptions -fno-rtti \
          -mwindows -mthumb -march=armv4t \
          -o GrsProbe.exe GrsProbe.cpp \
          -lcoredll -lcommctrl
        ls -lh GrsProbe.exe
        file GrsProbe.exe

    - name: Artifact yukle
      uses: actions/upload-artifact@v4
      with:
        name: GrsProbe-ARM-WinCE
        path: GrsProbe.exe
        retention-days: 30
